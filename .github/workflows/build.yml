name: Compile binaries
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.feature_level }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows, linux-arm, macos-arm, windows-arm]
        feature_level: [x86-64-v2, x86-64-v3, x86-64-v4]
        include:
          - os: linux
            runner: ubuntu-26.04
            toolchain: x86_64-unknown-linux-gnu
            artifact_path: target/release/target_compile_test
          - os: macos
            runner: macos-26-intel
            toolchain: x86_64-apple-darwin
            artifact_path: target/release/target_compile_test
          - os: windows
            runner: windows-2025-vs2026
            toolchain: x86_64-pc-windows-msvc
            artifact_path: target/release/target_compile_test.exe
          - os: linux-arm
            runner: ubuntu-26.04-arm
            toolchain: aarch64-unknown-linux-gnu
            artifact_path: target/release/target_compile_test
            feature_level: generic
            extra_rustflags: -C target-feature=+v8.2a
          - os: macos-arm
            runner: macos-26
            toolchain: aarch64-apple-darwin
            artifact_path: target/release/target_compile_test
            feature_level: generic
            extra_rustflags: -C target-feature=+v8.2a
          - os: windows-arm
            runner: windows-11-vs2026-arm
            toolchain: aarch64-pc-windows-msvc
            artifact_path: target/release/target_compile_test.exe
            feature_level: generic
            extra_rustflags: -C target-feature=+v8.2a
        exclude:
          - os: linux-arm
            feature_level: x86-64-v2
          - os: linux-arm
            feature_level: x86-64-v3
          - os: linux-arm
            feature_level: x86-64-v4
          - os: macos-arm
            feature_level: x86-64-v2
          - os: macos-arm
            feature_level: x86-64-v3
          - os: macos-arm
            feature_level: x86-64-v4
          - os: windows-arm
            feature_level: x86-64-v2
          - os: windows-arm
            feature_level: x86-64-v3
          - os: windows-arm
            feature_level: x86-64-v4
    env:
      RUSTFLAGS: -C target-cpu=${{ matrix.feature_level }} ${{ matrix.extra_rustflags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-${{ matrix.toolchain }}
      - name: Update dependencies
        run: cargo update
      - name: Build binary
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.feature_level }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 1
